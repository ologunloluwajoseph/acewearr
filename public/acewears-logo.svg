<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" role="img" aria-label="AceWears">
  <defs>
    <linearGradient id="awNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1128"/>
      <stop offset="1" stop-color="#1F2A47"/>
    </linearGradient>
    <linearGradient id="awAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9F1C"/>
      <stop offset="1" stop-color="#FFAD33"/>
    </linearGradient>
    <linearGradient id="awTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#008080"/>
      <stop offset="1" stop-color="#2FA3A3"/>
    </linearGradient>
  </defs>

  <!-- Monogram: A formed by interlocking weave loops -->
  <g transform="translate(6,4)">
    <!-- Outer hex-shield plate -->
    <path d="M28 0 L52 14 L52 42 L28 56 L4 42 L4 14 Z" fill="url(#awNavy)"/>

    <!-- Interlocking Loop 1 (amber) - left half of the A, woven over the right -->
    <path d="M16 42 C 12 30, 20 18, 28 12 C 36 18, 30 26, 28 32"
          stroke="url(#awAmber)" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Interlocking Loop 2 (teal) - right half, woven through the amber loop -->
    <path d="M40 42 C 44 30, 36 18, 28 12 C 20 18, 26 26, 28 32"
          stroke="url(#awTeal)" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- A crossbar -->
    <line x1="20" y1="32" x2="36" y2="32" stroke="#FF9F1C" stroke-width="3" stroke-linecap="round"/>

    <!-- Subtle weave crossing dots (signal the interlock) -->
    <circle cx="28" cy="12" r="2.2" fill="#FF9F1C"/>
    <circle cx="28" cy="32" r="1.8" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(70,0)" fill="#0A1128">
    <text x="0" y="42" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="28" font-weight="800" letter-spacing="0.5">
      <tspan>Ace</tspan><tspan fill="#FF9F1C">Wears</tspan>
    </text>
    <text x="2" y="55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="8" font-weight="500" letter-spacing="4" fill="#47506B">
      THREADS · REIMAGINED
    </text>
  </g>
</svg>
